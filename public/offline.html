<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d4d8f5"><title>離線 · 松櫻祭</title><style>:root{color-scheme:light dark;--sky:linear-gradient(170deg,#c9cff3,#ddd2f0 50%,#f6dbe8);--ink:#37263c;--rose:#b13d73}@media (prefers-color-scheme:dark){:root{--sky:linear-gradient(170deg,#1f1e3f,#2a2448 50%,#3a2848);--ink:#f3e9f4;--rose:#f0a3c6}}body{margin:0;min-height:100dvh;padding:12vh 8vw;box-sizing:border-box;background:var(--sky);color:var(--ink);font:18px/1.8 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}h1{margin:0;color:var(--rose);font-size:clamp(64px,16vw,140px);line-height:1;font-weight:900}main{max-width:36em}a{display:inline-block;margin-top:1em;padding:12px 24px;border-radius:999px;background:var(--rose);color:#fff;font-weight:700;text-decoration:none}</style><main><h1>暫時<br>離線</h1><p>核心頁面尚未成功儲存，或瀏覽器已清除資料。恢復連線後，可在頁尾「應用程式與離線閱讀」選擇「儲存核心頁面」。</p><p>目前無法確認最新活動資訊，請以官方社群公告為準。</p><a href="/">連線後重新開啟</a></main></html>
